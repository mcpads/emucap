name: Release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (omit for validation only)
        required: false
        type: string
      native_run:
        description: Completed native package assembly run (required for publication)
        required: false
        type: string
      validate_only:
        description: Validate this branch without a tag or publication
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-core-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      revision: ${{ steps.tag.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
          NATIVE_RUN: ${{ inputs.native_run }}
        run: |
          if [ "$VALIDATE_ONLY" = true ]; then
            revision=$(git rev-parse HEAD)
          else
            [[ "$NATIVE_RUN" =~ ^[0-9]+$ ]]
            [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]
            revision=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    uses: ./.github/workflows/core-validation.yml
    with:
      revision: ${{ needs.resolve.outputs.revision }}
      version: ${{ inputs.tag }}

  publish:
    if: ${{ !inputs.validate_only }}
    needs: [resolve, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: core-*
          merge-multiple: true
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: native-release-packages
          run-id: ${{ inputs.native_run }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Publish the prepared draft after all package checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REVISION: ${{ needs.resolve.outputs.revision }}
        shell: bash
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          actual=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
          type=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.type)
          if [ "$type" = tag ]; then
            actual=$(gh api "repos/$GH_REPO/git/tags/$actual" --jq .object.sha)
          fi
          test "$actual" = "$SOURCE_REVISION"
          cd artifacts
          python - <<'PY'
          import json, os
          index = json.load(open('NATIVE-PACKAGES.json'))
          if index['core_revision'] != os.environ['SOURCE_REVISION']:
              raise ValueError('native assembly must match the final release revision')
          PY
          sha256sum --check NATIVE-SHA256SUMS
          cat *.sha256 NATIVE-SHA256SUMS > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release upload "$RELEASE_TAG" *.tar.gz *.zip *.json SHA256SUMS
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
