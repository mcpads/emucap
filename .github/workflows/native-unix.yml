name: Native Unix adapter packages
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact producer commit to build
        type: string
        required: true
      reuse_run:
        description: Optional completed package run to repackage without compiling
        type: string
        default: ''
      adapter:
        type: choice
        default: all
        options: [all, mesen2, dolphin, ppsspp, mednafen, flycast, np2kai, mupen64plus, openmsx, mame-pc98, mame-neogeo, pcsx2, desmume-nds, xemu]
      platform:
        type: choice
        default: all
        options: [all, linux, macos, windows, assemble]
      runtime_run:
        description: Successful Windows build to package when platform is windows
        type: string
        default: ''
      source_run:
        description: Successful Unix package with matching Windows source inputs
        type: string
        default: ''
      source_platform:
        type: choice
        default: macos
        options: [linux, macos]
      packages:
        description: JSON array of adapter, platform and run for assembling all native packages
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: native-unix-${{ inputs.revision }}-${{ inputs.adapter }}-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  build:
    if: inputs.platform != 'windows' && inputs.platform != 'assemble'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        adapter: ${{ fromJSON(inputs.adapter != 'all' && format('["{0}"]', inputs.adapter) || '["mesen2","dolphin","ppsspp","mednafen","flycast","np2kai","mupen64plus","openmsx","mame-pc98","mame-neogeo","pcsx2","desmume-nds","xemu"]') }}
        platform: ${{ fromJSON(inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["linux","macos"]') }}
    runs-on: ${{ matrix.platform == 'macos' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: packaging
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        if: matrix.adapter == 'mesen2'
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify packaging boundaries
        run: python packaging/_tests/release/package_native_tests.py
      - name: Download completed package for reuse
        if: inputs.reuse_run != ''
        uses: actions/download-artifact@v4
        with:
          name: native-package-${{ matrix.adapter }}-${{ matrix.platform }}
          path: previous
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
      - name: Prepare package tooling
        if: inputs.reuse_run != ''
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = macos ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install sdl3 pkgconf
          else
            sudo apt-get update -qq
            sudo apt-get install -y patchelf
          fi
      - name: Build pinned native adapter
        if: inputs.reuse_run == ''
        shell: bash
        run: |
          set -o pipefail
          bash packaging/_tests/release/native_unix_build.sh '${{ matrix.adapter }}' source 2>&1 | tee native-build.log
      - name: Stage and verify runtime and source packages
        run: python packaging/_tests/release/package_native.py --source source --adapter '${{ matrix.adapter }}' --platform '${{ matrix.platform }}' --output artifacts ${{ inputs.reuse_run != '' && '--reuse previous' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-package-${{ matrix.adapter }}-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain incomplete packages for packaging recovery
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-incomplete-${{ matrix.adapter }}-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-build-log-${{ matrix.adapter }}-${{ matrix.platform }}
          path: |
            native-build.log
            source/native-toolchain.txt
          retention-days: 14
  package:
    if: inputs.platform == 'windows'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: packaging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify package boundaries
        run: python packaging/_tests/release/package_windows_tests.py
      - name: Resolve successful producer run
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN: ${{ inputs.runtime_run }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          for key in ('RUNTIME_RUN', 'SOURCE_RUN'):
              run_id = os.environ[key]
              if not run_id.isdecimal(): raise ValueError('run ID must be numeric')
              result = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}']))
              if result['conclusion'] != 'success' or result['event'] == 'pull_request':
                  raise ValueError('requires successful trusted producer run')
              if key == 'RUNTIME_RUN':
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                      out.write('revision=' + result['head_sha'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.producer.outputs.revision }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: native-runtime-${{ inputs.adapter }}-windows-x86_64
          path: payload
          run-id: ${{ inputs.runtime_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: native-package-${{ inputs.adapter }}-${{ inputs.source_platform }}
          path: native-source
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.adapter == 'xemu'
        with:
          name: native-evidence-xemu-windows-x86_64
          path: evidence
          run-id: ${{ inputs.runtime_run }}
          github-token: ${{ github.token }}
      - name: Verify and archive native payload
        env:
          ADAPTER: ${{ inputs.adapter }}
        run: |
          args=()
          if [ "$ADAPTER" = xemu ]; then
            args+=(--binary-digest "$(cut -d ' ' -f1 evidence/native-binary.sha256)")
          fi
          python packaging/_tests/release/package_windows.py --adapter "$ADAPTER" \
            --source source --payload payload --native-source native-source --output artifacts "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-package-${{ inputs.adapter }}-windows
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
  assemble:
    if: inputs.platform == 'assemble'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: packaging
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify collection boundaries
        run: python packaging/_tests/release/collect_native_tests.py
      - name: Collect verified native release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_SELECTION: ${{ inputs.packages }}
        run: |
          python -c 'import os,pathlib; pathlib.Path("selection.json").write_text(os.environ["PACKAGE_SELECTION"])'
          python packaging/_tests/release/collect_native.py --selection selection.json \
            --source source --output artifacts --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-packages
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-index
          path: |
            artifacts/NATIVE-PACKAGES.json
            artifacts/NATIVE-SHA256SUMS
          if-no-files-found: error
          retention-days: 14
